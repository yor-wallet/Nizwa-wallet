<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nizwa Wallet">
<title>Nizwa Wallet</title>
<style>
:root{--bg:#F7F7F9;--panel:#fff;--field:#f1f0f5;--text:#15121c;--muted:#6f6b7a;--line:#e6e4ec;--violet:#7c3aed;--violet-2:#5b21b6;--yellow:#ffc93c;--green:#10b981;--red:#c81e4a;--shadow:0 10px 30px rgba(20,10,60,.08);--grad-v:linear-gradient(160deg,#7c3aed,#5b21b6)}
html[data-theme="dark"]{--bg:#07070B;--panel:#111116;--field:#1a1a22;--text:#f6f4fb;--muted:#a19cb0;--line:#232330;--violet:#9d6bff;--shadow:0 10px 30px rgba(0,0,0,.5);--grad-v:linear-gradient(160deg,#7c3aed,#4c1d95)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Kufi Arabic",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;transition:transform .12s,opacity .15s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.45}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0 0 10px}
h1{font-size:26px;letter-spacing:-.5px}h2{font-size:18px}h3{font-size:16px}
p{line-height:1.55}
small,.muted{color:var(--muted)}small{font-size:12px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex-shrink:0}
.app{max-width:520px;margin:auto;min-height:100vh;min-height:100dvh;position:relative}
header.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 8px}
header.appbar .right{display:flex;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--text);position:relative;flex-shrink:0}
.avatar-btn{background:var(--grad-v);color:#fff;font-weight:800;border:0;font-size:15px}
main{padding:8px 20px calc(120px + env(safe-area-inset-bottom,0px))}
main.enter{animation:in .28s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{border:1px solid var(--line);border-radius:22px;padding:18px;background:var(--panel);margin-bottom:14px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.btn{width:100%;min-height:54px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-weight:700;padding:12px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--violet);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(124,58,237,.35)}
.btn.soft{background:var(--field);border-color:transparent}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.link{border:0;background:none;color:var(--violet);font-weight:700;padding:6px 4px;font-size:14px}
.row-flex{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.section h2{margin:0;font-size:16px}
.field{display:block;margin:14px 0}
.field>span{display:block;margin-bottom:8px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 4px rgba(124,58,237,.16)}
.input-row{display:flex;gap:8px;align-items:stretch}
.prefix{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:0 14px;font-weight:700;font-size:14px;white-space:nowrap}
.error{color:var(--red);font-size:13px;min-height:1em;margin-top:4px}
.hint{padding:12px;background:var(--field);border-radius:14px;font-size:12px;line-height:1.7;color:var(--muted);margin:12px 0}
.badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;background:var(--field);color:var(--violet)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:10px}
.tile i{width:38px;height:38px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--violet)}
.tile strong{font-size:13px}
.splash{position:fixed;inset:0;background:linear-gradient(160deg,#2e1065,#4c1d95 40%,#7c3aed);z-index:500;display:grid;place-items:center;color:#fff;text-align:center;transition:opacity .5s,visibility .5s}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash h1{margin-top:22px;font-size:34px;color:#fff;animation:in .6s .35s both}
.splash .ar{font-size:16px;opacity:.9;animation:in .6s .5s both;direction:rtl}
.splash .en{font-size:13px;opacity:.65;animation:in .6s .6s both}
.splash .loader{margin:26px auto 0;width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--yellow);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 6px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;padding:6px 2px;border-radius:14px}
.quick i{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--violet)}
.stack{position:relative;margin:4px 0 18px}
.card-yellow{background:linear-gradient(120deg,#ffd24d,#ffc93c);color:#1f1600;border-radius:20px;padding:14px 18px 40px;display:flex;justify-content:space-between;font:600 13px ui-monospace,monospace;letter-spacing:1.5px;direction:ltr}
.card-violet{background:var(--grad-v);color:#fff;border-radius:22px;padding:20px;margin-top:-30px;position:relative;box-shadow:0 20px 45px rgba(91,33,182,.45);overflow:hidden}
.card-violet .num{font:600 13px ui-monospace,monospace;letter-spacing:1.5px;direction:ltr}
.card-violet .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-violet small{color:#e9ddff;font-size:11px}
.card-violet .bal{font-size:clamp(26px,8vw,36px);font-weight:800;letter-spacing:-.8px;margin:8px 0 12px;font-variant-numeric:tabular-nums;direction:ltr}
.eye-btn{background:rgba(255,255,255,.15);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.tx{display:flex;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 0;text-align:start}
.tx:last-child{border-bottom:0}
.tx .tx-icon{width:42px;height:42px;border-radius:50%;background:var(--field);display:grid;place-items:center;flex-shrink:0;color:var(--violet)}
.tx.tx-in .tx-icon{background:rgba(16,185,129,.14);color:var(--green)}
.tx .tx-body{flex:1;min-width:0}
.tx .tx-body strong{display:block;font-size:14px;font-weight:700}
.tx .tx-body small{color:var(--muted);margin-top:2px;display:block}
.tx .tx-amt{font-size:14px;font-weight:700;white-space:nowrap;direction:ltr}
.tx.tx-in .tx-amt{color:var(--green)}
nav.tabbar{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));inset-inline:0;z-index:20;padding:0 16px;pointer-events:none}
.tabbar-inner{max-width:480px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;display:flex;justify-content:space-around;padding:8px;box-shadow:var(--shadow);pointer-events:auto}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);padding:8px 12px;border-radius:999px;font-weight:700;font-size:10.5px}
.tabbar button.active{color:#fff;background:var(--grad-v);box-shadow:0 8px 18px rgba(124,58,237,.4)}
.list-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 0;text-align:start;border-bottom:1px solid var(--line);color:inherit}
.list-item:last-child{border-bottom:0}
.list-item .li-icon{width:40px;height:40px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--violet);flex-shrink:0}
.list-item .li-body{flex:1;min-width:0}
.list-item .li-body strong{display:block;font-size:14px}
.list-item .li-body small{color:var(--muted);display:block}
.list-item .chev{color:var(--muted);opacity:.6}
[dir="rtl"] .chev{transform:scaleX(-1)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border:0}
.setting strong{font-size:14px;font-weight:700}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s}
.switch[aria-checked="true"]{background:var(--violet)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
[dir="rtl"] .switch::after{left:auto;right:3px}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-22px)}
.otp-inputs{display:flex;gap:8px;justify-content:center;direction:ltr;margin:22px 0}
.otp-inputs input{width:46px;height:56px;text-align:center;font-size:22px;font-weight:800;padding:0;border:2px solid var(--line);border-radius:14px}
.otp-inputs input.filled{border-color:var(--violet)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr;margin:18px 0}
.key{font-size:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:56px;font-weight:600}
.dots{display:flex;justify-content:center;gap:16px;margin:26px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:background .2s}
.dots i.on{background:var(--violet)}
.amount-display{font-size:clamp(34px,10vw,52px);font-weight:800;text-align:center;margin:20px 0 6px;direction:ltr;overflow-wrap:anywhere}
.amount-display small{font-size:16px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px}
.chip.active{background:var(--violet);color:#fff;border-color:transparent}
.process{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}
.process .orbit{position:relative;width:160px;height:160px;display:grid;place-items:center;margin-bottom:26px}
.process .ring{position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(124,58,237,.28);animation:spin 4s linear infinite}
.process .ring2{position:absolute;inset:14px;border-radius:50%;border:3px solid transparent;border-top-color:var(--violet);border-right-color:var(--violet);animation:spin 1.4s linear infinite}
.process .wallet{width:74px;height:74px;border-radius:22px;background:var(--grad-v);display:grid;place-items:center;color:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.tx-line{margin-top:20px;width:80%;max-width:320px;height:6px;background:var(--field);border-radius:99px;overflow:hidden;position:relative}
.tx-line::before{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:var(--grad-v);border-radius:99px;animation:flow 2.4s ease-in-out infinite}
@keyframes flow{to{left:100%}}
.check-big{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#34d399,#10b981);display:grid;place-items:center;color:#fff;margin:0 auto 18px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.success-wrap{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}
.success-wrap .amt{font-size:34px;font-weight:800;margin:6px 0 4px;direction:ltr}
.receipt-wrap{background:var(--bg);min-height:100vh}
.receipt-hero{background:var(--grad-v);color:#fff;padding:calc(30px + env(safe-area-inset-top,0px)) 20px 70px;text-align:center}
.receipt-hero .logo-sq{width:64px;height:64px;margin:0 auto 10px;border-radius:18px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.2)}
.receipt-hero h1{color:#fff;font-size:22px;margin-bottom:2px}
.receipt-hero .en{font-size:14px;opacity:.85;font-weight:600}
.receipt-hero .tag{font-size:11.5px;opacity:.7;margin-top:4px}
.receipt-body{padding:0 16px 30px;margin-top:-56px;position:relative}
.receipt-card{background:var(--panel);border-radius:26px;padding:24px 20px;box-shadow:0 20px 50px rgba(20,10,60,.12);border:1px solid var(--line)}
.receipt-check{width:82px;height:82px;margin:-56px auto 12px;border-radius:50%;background:linear-gradient(135deg,#34d399,#10b981);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 8px var(--panel);animation:pop .55s}
.receipt-card h2{text-align:center;color:var(--violet);margin-bottom:2px}
.receipt-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.amount-box{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.16);border-radius:18px;padding:18px;text-align:center;margin:16px 0}
.amount-box .cur{font-size:13px;color:var(--violet);font-weight:800;letter-spacing:1px}
.amount-box .val{font-size:34px;font-weight:800;color:var(--violet);direction:ltr}
.amount-box .lbl{font-size:12px;color:var(--muted)}
.rrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .ric{width:38px;height:38px;border-radius:50%;background:rgba(124,58,237,.1);color:var(--violet);display:grid;place-items:center;flex-shrink:0}
.rrow .ric svg{width:18px;height:18px}
.rrow .rbody{flex:1;min-width:0}
.rrow .rk{font-size:11.5px;color:var(--muted);display:block;margin-bottom:2px}
.rrow strong{font-size:13.5px;font-weight:700;display:block}
.rrow small{display:block;color:var(--muted);font-size:12px;direction:ltr;margin-top:1px}
.thanks{text-align:center;background:var(--field);padding:12px;border-radius:14px;font-size:12.5px;color:var(--muted);margin:16px 0;line-height:1.6}
.receipt-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;padding:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.receipt-foot .brand{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:700;font-size:13px}
.receipt-foot .brand-logo{width:28px;height:28px;border-radius:8px;background:var(--grad-v);display:grid;place-items:center;color:var(--yellow);font-weight:900;font-size:15px}
dialog.modal{width:calc(100% - 28px);max-width:460px;margin:auto;padding:20px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:24px;overflow:auto;max-height:88dvh}
dialog.modal::backdrop{background:rgba(5,5,15,.55)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.modal-head h2{margin:0}
#toast{position:fixed;z-index:100;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);border-radius:999px;padding:12px 18px;max-width:calc(100% - 30px);font-size:13px;font-weight:600;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--green);color:#fff}
#toast.err{background:var(--red);color:#fff}
#lockScreen{position:fixed;inset:0;z-index:400;background:var(--bg);display:none;place-items:center;padding:20px;text-align:center}
#lockScreen.on{display:grid}
#lockScreen .avatar-lock{width:96px;height:96px;border-radius:50%;background:var(--grad-v);color:#fff;display:grid;place-items:center;margin:0 auto 20px;font-size:38px}
.caption{font-size:11.5px;text-align:center;color:var(--muted);line-height:1.6;margin:16px 0}
.center{text-align:center}
.back-bar{display:flex;gap:12px;align-items:center;margin-bottom:14px}
[dir="rtl"] .back-bar svg{transform:scaleX(-1)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.empty svg{width:48px;height:48px;opacity:.4;margin-bottom:10px}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important}}
</style>
</head>
<body>

<div id="splash" class="splash">
  <div>
    <svg viewBox="0 0 120 120" width="120" height="120">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
      <rect width="120" height="120" rx="30" fill="url(#lg)"/>
      <path d="M24 44h72v52a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8z" fill="#fff" opacity=".95"/>
      <path d="M24 44 38 24h44l14 20z" fill="#fff" opacity=".82"/>
      <rect x="78" y="62" width="20" height="12" rx="6" fill="#ffc93c"/>
    </svg>
    <h1>Nizwa Wallet</h1>
    <p class="ar" id="splashAr"></p>
    <p class="en">Your Wallet .. In Your Hands</p>
    <div class="loader"></div>
  </div>
</div>

<div id="lockScreen" role="dialog">
  <div style="width:100%;max-width:360px">
    <div class="avatar-lock">&#128274;</div>
    <h2 id="lockTitle"></h2>
    <p class="muted" id="lockMsg"></p>
    <label class="field" style="text-align:start"><span id="lockPwLabel"></span><input id="lockPw" type="password"></label>
    <p id="lockError" class="error"></p>
    <button class="btn primary" id="unlockBtn"></button>
    <button class="link" id="lockLogout" style="margin-top:10px"></button>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="appbar" id="appbar"></header>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar" hidden><div class="tabbar-inner" id="tabbarInner"></div></nav>

<dialog class="modal" id="modal"></dialog>
<div id="toast" role="status"></div>
<div id="printArea"></div>

<script>
"use strict";

/* ============================================================
   NIZWA WALLET - Version encodage-safe (Unicode escapes)
   ============================================================ */

/* ---------- Constantes ---------- */
var BRAND="Nizwa Wallet";
var BRAND_AR="\u0646\u0632\u0648\u0649 \u0648\u0627\u0644\u064A\u062A";
var TAGLINE_AR="\u0645\u062D\u0641\u0638\u062A\u0643 .. \u0628\u064A\u062F\u0643";
var TAGLINE_EN="Your Wallet .. In Your Hands";
var DURATION=27000, OTP_CODE="123456", OTP_TIMEOUT=45;
var MAX_OTP_ATTEMPTS=3, OTP_LOCK_SECONDS=30;
var INITIAL_BALANCE_BAISA=67890000;
var STORE="nzwa_v3";

/* ---------- Textes arabes (Unicode escapes) ---------- */
var T = {
  signIn:"\u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062F\u062E\u0648\u0644",
  signUp:"\u0625\u0646\u0634\u0627\u0621 \u062D\u0633\u0627\u0628 \u062C\u062F\u064A\u062F",
  phone:"\u0631\u0642\u0645 \u0627\u0644\u0647\u0627\u062A\u0641",
  password:"\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631",
  confirmPw:"\u062A\u0623\u0643\u064A\u062F \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631",
  fullName:"\u0627\u0644\u0627\u0633\u0645 \u0627\u0644\u0643\u0627\u0645\u0644",
  next:"\u0645\u062A\u0627\u0628\u0639\u0629",
  back:"\u0631\u062C\u0648\u0639", cancel:"\u0625\u0644\u063A\u0627\u0621",

/* ---------- Crypto ---------- */
var Crypto={
  hasSubtle:function(){return typeof crypto!=="undefined"&&crypto.subtle&&typeof crypto.subtle.importKey==="function";},
  randSalt:function(){var a=new Uint8Array(16);if(typeof crypto!=="undefined"&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);return a;},
  bufToB64:function(b){var s="";var u=new Uint8Array(b);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);},
  b64ToBuf:function(s){var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;},
  simpleHash:function(pw,saltB64){
    var s=saltB64+"|"+pw+"|nizwa",h=0,i;
    for(i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h=h|0;}
    return "S"+Math.abs(h).toString(36)+"_"+s.length;
  },
  async hash(pw){
    var salt=this.randSalt();
    var saltB64=this.bufToB64(salt);
    if(this.hasSubtle()){
      try{
        var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
        var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},km,256);
        return {hash:this.bufToB64(bits),salt:saltB64,method:"pbkdf2"};
      }catch(e){console.warn("PBKDF2 fail, fallback");}
    }
    return {hash:this.simpleHash(pw,saltB64),salt:saltB64,method:"simple"};
  },
  async verify(pw,h,s,method){
    if(method==="simple")return this.simpleHash(pw,s)===h;
    if(this.hasSubtle()){
      try{
        var salt=this.b64ToBuf(s);
        var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
        var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},km,256);
        return this.bufToB64(bits)===h;
      }catch(e){return false;}
    }
    return this.simpleHash(pw,s)===h;
  }
};

var autoLockTimer=null,lastTouch=0;
function sessionStart(){
  STATE.session={authenticated:true,loginAt:Date.now(),lastActivityAt:Date.now()};
  scheduleLock();

function sessionTouch(){

var Account={
  async create(data){

      id:"main",

      fullName:data.name||"",

      createdAt:Date.now(),

      passwordCredential:{hash:cred.hash,salt:cred.salt,method:cred.method}
    };
    STATE.user=u;
    STATE.balanceBaisa=INITIAL_BALANCE_BAISA;
    STATE.cards=[{id:"c1",last4:"7216",exp:"12/29",holder:u.fullName.toUpperCase(),brand:"VISA",def:true,frozen:false,balance:INITIAL_BALANCE_BAISA}];

    pushNotif("alert",t("accountCreated")+" · "+money(INITIAL_BALANCE_BAISA)+" OMR");
    Store.save();
  },
  async verify(pw){
    if(!STATE.user||!STATE.user.passwordCredential)return false;
    var c=STATE.user.passwordCredential;
    return Crypto.verify(pw,c.hash,c.salt,c.method);
  }
};

function logActivity(type,desc){
  STATE.activity.unshift({id:uid(),type:type,timestamp:Date.now(),description:desc});
  if(STATE.activity.length>200)STATE.activity.length=200;
  Store.save();
}
function pushNotif(type,msg){
  STATE.notifications.unshift({id:uid(),type:type,message:msg,createdAt:Date.now(),read:false});
  Store.save();
}

var Tx={
  async create(type,amount,sender,recipient,phone){
    var tx={id:uid(),reference:txRef(),type:type,status:"PENDING",amount:amount,currency:"OMR",
      sender:sender,recipient:recipient,recipientPhone:phone,note:"",
      createdAt:Date.now(),completedAt:null,
      balanceBefore:STATE.balanceBaisa,balanceAfter:null};
    STATE.transactions.unshift(tx);
    Store.save();
    return tx;
  },
  async complete(id){
    var tx=STATE.transactions.find(function(x){return x.id===id;});
    if(!tx)return null;
    if(tx.amount>STATE.balanceBaisa){tx.status="FAILED";tx.completedAt=Date.now();Store.save();return tx;}
    tx.balanceBefore=STATE.balanceBaisa;
    STATE.balanceBaisa-=tx.amount;
    tx.balanceAfter=STATE.balanceBaisa;
    tx.status="COMPLETED";tx.completedAt=Date.now();
    Store.save();
    return tx;
  },
  async credit(id){
    var tx=STATE.transactions.find(function(x){return x.id===id;});
    if(!tx)return null;
    tx.balanceBefore=STATE.balanceBaisa;
    STATE.balanceBaisa+=tx.amount;
    tx.balanceAfter=STATE.balanceBaisa;
    tx.status="COMPLETED";tx.completedAt=Date.now();
    Store.save();
    return tx;
  },
  get:function(id){return STATE.transactions.find(function(x){return x.id===id;});},
  isIncoming:function(x){return x.balanceAfter!=null&&x.balanceAfter>x.balanceBefore;}
};

/* ---------- App ---------- */
var App={
  page:"splash",_pt:null,_actionLock:false,

  boot:function(){
    var self=this;
    setTimeout(function(){self.hideSplash();},2500);
    // Load
    var had=Store.load();
    if(had&&STATE.user){
      if(typeof STATE.balanceBaisa!=="number"||STATE.balanceBaisa<=0){
        STATE.balanceBaisa=INITIAL_BALANCE_BAISA;Store.save();
      }
      if(!STATE.cards.length){
        STATE.cards=[{id:"c1",last4:"7216",exp:"12/29",holder:STATE.user.fullName.toUpperCase(),brand:"VISA",def:true,frozen:false,balance:INITIAL_BALANCE_BAISA}];
      }
      this.page=STATE.user.lastLoginAt?"login-existing":"login";
    }else{
      this.page="create";
    }
    this.applyTheme();
    setTimeout(function(){self.hideSplash();},700);
  },

  hideSplash:function(){
    var s=$("#splash");
    if(!s||s.classList.contains("gone"))return;
    s.classList.add("gone");
    this.render();
  },

  applyTheme:function(){
    document.documentElement.dataset.theme=STATE.theme==="dark"?"dark":"light";
    document.documentElement.dir="rtl";
  },

  go:function(p){
    if(STATE.transferLock&&["processing","success","receipt"].indexOf(p)<0)return;
    if(!STATE.session.authenticated&&["splash","welcome","login","create","otp","pin-setup","login-existing"].indexOf(p)<0)p="login";
    this.page=p;
    this.render();
    window.scrollTo(0,0);
    sessionTouch();
  },

  render:function(){
    var self=this;
    try{
      var authed=STATE.session.authenticated;
      $("#app").hidden=this.page==="splash";

      if(authed&&["processing","success","receipt"].indexOf(this.page)<0){
        var unread=STATE.notifications.filter(function(n){return !n.read;}).length;
        $("#appbar").innerHTML='<button class="icon-btn" data-page="settings">'+svg("menu")+'</button>'+
          '<div class="right">'+
          '<button class="icon-btn" data-page="notifications" style="position:relative">'+svg("bell")+
          (unread>0?'<span style="position:absolute;top:6px;right:6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;min-width:16px;height:16px;display:grid;place-items:center">'+(unread>9?"9+":unread)+'</span>':"")+
          '</button>'+
          '<button class="icon-btn avatar-btn" data-page="profile">'+esc(STATE.user&&STATE.user.avatar||"A")+'</button></div>';
        $("#appbar").hidden=false;
      }else{$("#appbar").innerHTML="";$("#appbar").hidden=true;}

      var showTabs=authed&&["home","transactions","cards","profile"].indexOf(this.page)>=0;
      $("#tabbar").hidden=!showTabs;
      if(showTabs){
        var tabs=[["home","home","home"],["transactions","history","transactions"],["cards","card","cards"],["profile","user","profile"]];
        $("#tabbarInner").innerHTML=tabs.map(function(tb){
          var k=tb[0],ic=tb[1],lbl=tb[2];
          return '<button data-page="'+k+'" class="'+(self.page===k?"active":"")+'">'+svg(ic)+'<span>'+esc(t(lbl))+'</span></button>';
        }).join("");
      }

      var screens={
        splash:function(){return "";},welcome:function(){return S.welcome();},
        login:function(){return S.login();},"login-existing":function(){return S.loginExisting();},
        create:function(){return S.create();},otp:function(){return S.otp();},
        "pin-setup":function(){return S.pinSetup();},home:function(){return S.home();},
        transactions:function(){return S.transactions();},cards:function(){return S.cards();},
        profile:function(){return S.profile();},send:function(){return S.send();},
        "send-amount":function(){return S.sendAmount();},"send-confirm":function(){return S.sendConfirm();},
        processing:function(){return S.processing();},success:function(){return S.success();},
        receipt:function(){return S.receipt();},receive:function(){return S.receive();},
        request:function(){return S.request();},topup:function(){return S.topup();},
        "tx-detail":function(){return S.txDetail();},notifications:function(){return S.notifications();},
        security:function(){return S.security();},help:function(){return S.help();},
        language:function(){return S.language();},settings:function(){return S.settings();},
        contacts:function(){return S.contacts();},expenses:function(){return S.expenses();},
        more:function(){return S.more();},activity:function(){return S.activityPage();},
        account:function(){return S.accountInfo();},backup:function(){return S.backup();}
      };
      var fn=screens[this.page]||screens.home;
      $("#view").innerHTML=fn();
      $("#view").classList.remove("enter");
      requestAnimationFrame(function(){$("#view").classList.add("enter");});
      if(this.page==="processing")this.startProcessing();
      if(this.page==="otp")setTimeout(function(){var e=$$("[data-otp]")[0];if(e)e.focus();},200);
    }catch(e){
      console.error("Render error",e);
      $("#view").innerHTML='<div class="card"><h2>Error</h2><p class="muted">'+esc(e.message||String(e))+'</p></div>';
    }
  },

  startProcessing:function(){
    var self=this;
    if(!STATE.draft||!STATE.draft.txId)return this.go("home");
    var start=Date.now();
    clearInterval(this._pt);
    this._pt=setInterval(function(){
      if(Date.now()-start>=DURATION){clearInterval(self._pt);self.finishProcessing();}
    },200);
  },

  finishProcessing:async function(){
    var tx=Tx.get(STATE.draft.txId);
    if(!tx){STATE.transferLock=false;return this.go("home");}
    await Tx.complete(tx.id);
    if(tx.status==="COMPLETED"){
      pushNotif("tx",t("transferDone")+" · "+money(tx.amount)+" OMR");
      logActivity("TRANSFER_COMPLETED",tx.reference+" → "+fmtPhone(tx.recipientPhone));
      logActivity("RECEIPT_CREATED",tx.reference);
    }
    STATE.transferLock=false;
    STATE.currentTxId=tx.id;
    try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
    this.go("success");
    var self=this;
    setTimeout(function(){if(self.page==="success")self.go("receipt");},1600);
  }
};

  var name=$("#crName").value.trim();
  var phone=normPhone($("#crPhone").value);

  if(!name||!phone||!pw){err.textContent=t("required");return;}
  if(!/^\d{8}$/.test(phone)){err.textContent=t("invalidNumber");return;}
  if(pw.length<6){err.textContent=t("pwWeak");return;}
  if(pw!==pw2){err.textContent=t("pwMismatch");return;}
  STATE.onboarding.pending={name:name,phone:phone,password:pw};
  STATE.onboarding.otpAttempts=0;
  STATE.onboarding.otpLockUntil=0;
  App.go("otp");
}

async function handleLogin(){
  var err=$("#formError");
  var phone=normPhone($("#loginPhone").value);
  var pw=$("#loginPw").value;
  if(!/^\d{8}$/.test(phone)){err.textContent=t("invalidNumber");return;}
  if(!STATE.user||STATE.user.phone!==phone){err.textContent=t("invalidLogin");logActivity("LOGIN_FAILED","Tel inconnu");return;}
  var ok=await Account.verify(pw);
  if(!ok){err.textContent=t("invalidLogin");logActivity("LOGIN_FAILED","PW incorrect");return;}
  STATE.user.lastLoginAt=Date.now();
  sessionStart();
  logActivity("LOGIN_SUCCESS",STATE.user.fullName);
  Store.save();
  toast(t("loggedIn"),"ok");
  App.go("home");
}

async function handleExistingLogin(){
  var err=$("#formError");
  var pw=$("#existingPw").value;
  var ok=await Account.verify(pw);
  if(!ok){err.textContent=t("invalidLogin");logActivity("LOGIN_FAILED","");return;}
  STATE.user.lastLoginAt=Date.now();
  sessionStart();
  logActivity("LOGIN_SUCCESS",STATE.user.fullName);
  Store.save();
  toast(t("loggedIn"),"ok");
  App.go("home");
}

var otpTimerInterval=null,otpSeconds=OTP_TIMEOUT;
function startOtpTimer(){
  clearInterval(otpTimerInterval);
  otpSeconds=OTP_TIMEOUT;
  function update(){
    var el=$("#otpTimer");if(!el)return;
    var m=String(Math.floor(otpSeconds/60)).padStart(2,"0");
    var s=String(otpSeconds%60).padStart(2,"0");
    el.textContent=t("otpResendIn")+" "+m+":"+s;
    var btn=$("#otpResendBtn");if(btn)btn.disabled=otpSeconds>0;
  }
  update();
  otpTimerInterval=setInterval(function(){
    otpSeconds--;
    if(otpSeconds<=0){
      clearInterval(otpTimerInterval);otpSeconds=0;
      var el=$("#otpTimer");if(el)el.textContent=t("otpResendReady");
      var btn=$("#otpResendBtn");
      if(btn){btn.disabled=false;btn.onclick=startOtpTimer;}
      return;
    }
    update();
  },1000);
}

function verifyOtp(code){
  var now=Date.now();
  if(STATE.onboarding.otpLockUntil>now){$("#formError").textContent=t("otpLocked")||t("tooManyAttempts");return;}
  if(code!==OTP_CODE){
    STATE.onboarding.otpAttempts++;
    if(STATE.onboarding.otpAttempts>=MAX_OTP_ATTEMPTS){
      STATE.onboarding.otpLockUntil=now+OTP_LOCK_SECONDS*1000;
      STATE.onboarding.otpAttempts=0;
      $("#formError").textContent=t("tooManyAttempts");
    }else{
      $("#formError").textContent=t("wrongOTP");
    }
    $$("[data-otp]").forEach(function(i){i.value="";i.classList.remove("filled");});
    var f=$$("[data-otp]")[0];if(f)setTimeout(function(){f.focus();},50);
    return;
  }
  clearInterval(otpTimerInterval);
  setTimeout(function(){
    STATE.pinStep="create";STATE.pinBuffer="";STATE.pinTemp="";
    App.go("pin-setup");
  },200);
}

function handlePinKey(k){
  var buf=STATE.pinBuffer;
  if(k==="clear")STATE.pinBuffer="";
  else if(k==="back")STATE.pinBuffer=buf.slice(0,-1);
  else if(/^\d$/.test(k)&&buf.length<4)STATE.pinBuffer=buf+k;
  $$("[data-dot]").forEach(function(d,i){
    d.style.background=i<STATE.pinBuffer.length?"var(--violet)":"var(--line)";
  });
  if(STATE.pinBuffer.length===4){
    setTimeout(function(){processPin();},180);
  }
}

async function processPin(){
  var pin=STATE.pinBuffer;
  if(STATE.pinStep==="create"){
    STATE.pinTemp=pin;
    STATE.pinBuffer="";
    STATE.pinStep="confirm";
    App.render();
  }else if(STATE.pinStep==="confirm"){
    if(pin===STATE.pinTemp){
      if(!STATE.onboarding.pending){App.go("create");return;}
      try{
        await Account.create(STATE.onboarding.pending);
        sessionStart();
        logActivity("LOGIN_SUCCESS",STATE.user.fullName);
        STATE.pinBuffer="";STATE.pinTemp="";STATE.pinStep="create";
        STATE.onboarding.pending=null;
        try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
        toast(t("accountCreated"),"ok");
        App.go("home");
      }catch(e){
        console.error(e);
        toast("Erreur: "+(e.message||""),"err");
      }
    }else{
      try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
      STATE.pinBuffer="";STATE.pinStep="create";STATE.pinTemp="";
      $$("[data-dot]").forEach(function(x){x.style.background="var(--line)";});
      var e=$("#formError");if(e)e.textContent=t("pinMismatch");
      setTimeout(function(){App.render();},400);
    }
  }
}

function openSend(id){
  var c=STATE.contacts.find(function(x){return x.id===id;});
  if(!c)return;
  STATE.draft={phone:"+968 "+c.phone,phoneRaw:c.phone};
  STATE.raw="";
  App.go("send-amount");
}

function pushKey(k){
  if(!STATE.draft)STATE.draft={};
  if(k==="back")STATE.raw=STATE.raw.slice(0,-1);
  else if(k==="."){if(STATE.raw.indexOf(".")<0)STATE.raw=(STATE.raw||"0")+".";}
  else if(/^\d$/.test(k)){
    var parts=STATE.raw.split(".");
    if(parts[1]&&parts[1].length>=3)return;
    if(STATE.raw==="0")STATE.raw=k;
    else STATE.raw+=k;
    if(STATE.raw.replace(".","").length>10)STATE.raw=STATE.raw.slice(0,-1);
  }
  var el=$("#amountValue");if(el)el.textContent=STATE.raw===""?"0":STATE.raw;
}

async function handleAction(act,el){
  if(App._actionLock&&["confirm-send","do-topup","do-request"].indexOf(act)>=0)return;
  switch(act){
    case "toggle-hide":STATE.hidden=!STATE.hidden;Store.save();App.render();break;

    case "reset-account":
      $("#modal").innerHTML='<div class="modal-head"><h2>'+esc(t("resetData"))+'</h2><button class="icon-btn" data-close>'+svg("close")+'</button></div>'+
        '<p>'+esc(t("resetConfirm"))+'</p>'+
        '<div class="grid2" style="margin-top:12px"><button class="btn soft" data-close>'+esc(t("cancel"))+'</button>'+
        '<button class="btn danger" data-action="confirm-reset">'+esc(t("yes"))+'</button></div>';
      $("#modal").showModal();break;

    case "send-continue":
      var p=normPhone($("#sendPhone").value||"");
      var e=$("#formError");
      if(!/^\d{8}$/.test(p)){if(e)e.textContent=t("invalidNumber");return;}
      STATE.draft={phone:"+968 "+p,phoneRaw:p};
      STATE.raw="";
      App.go("send-amount");break;

    case "review-send":
      var b=parseAmount(STATE.raw);
      var er=$("#formError");
      if(!b||b<=0){if(er)er.textContent=t("invalidAmount");return;}
      if(b>STATE.balanceBaisa){if(er)er.textContent=t("insufficient");return;}
      var sim=STATE.transactions.find(function(x){
        return x.status!=="COMPLETED"&&x.status!=="CANCELLED"&&
          x.createdAt>Date.now()-20000&&
          x.recipientPhone===normPhone(STATE.draft.phoneRaw)&&
          x.amount===b;
      });
      if(sim){if(er)er.textContent=t("transferSimilar");return;}
      STATE.draft.amountBaisa=b;
      App.go("send-confirm");break;

    case "confirm-send":
      if(STATE.transferLock)return;
      App._actionLock=true;
      STATE.transferLock=true;
      try{
        var tx=await Tx.create("transfer",STATE.draft.amountBaisa,
          STATE.user.fullName,STATE.draft.phone,STATE.draft.phoneRaw);
        logActivity("TRANSFER_STARTED",tx.reference+" \u2192 "+fmtPhone(STATE.draft.phoneRaw));
        STATE.draft.txId=tx.id;
        App.go("processing");
      }catch(e){STATE.transferLock=false;toast("Erreur","err");}
      App._actionLock=false;
      break;

    case "show-receipt":App.go("receipt");break;
    case "back-home":App.go("home");break;
    case "share-receipt":
    case "download-receipt":
    case "print-receipt":
      handleReceiptAction(act);break;
    case "open-receipt":App.go("receipt");break;
    case "mark-all-read":STATE.notifications.forEach(function(n){n.read=true;});Store.save();App.render();break;

    case "do-topup":
      var tb=parseAmount($("#topupAmount").value||"");
      if(!tb||tb<=0){toast(t("invalidAmount"),"err");return;}
      var ttx=await Tx.create("topup",tb,BRAND,BRAND,BRAND);
      await Tx.credit(ttx.id);
      logActivity("TRANSFER_COMPLETED","Top-up "+ttx.reference);
      toast(t("topupNow"),"ok");App.go("home");break;

    case "do-request":
      var rf=normPhone($("#reqFrom").value||"");
      var ra=parseAmount($("#reqAmount").value||"");
      if(!/^\d{8}$/.test(rf)||!ra||ra<=0){toast(t("required"),"err");return;}
      var rtx=await Tx.create("request",ra,STATE.user.fullName,"+968 "+rf,rf);
      rtx.status="PENDING";Store.save();
      toast(t("reqBtn"),"ok");App.go("home");break;

    case "add-contact":
      $("#modal").innerHTML='<div class="modal-head"><h2>'+esc(t("addContact"))+'</h2><button class="icon-btn" data-close>'+svg("close")+'</button></div>'+
        '<label class="field"><span>'+esc(t("fullName"))+'</span><input id="cName" maxlength="60"></label>'+
        '<label class="field"><span>'+esc(t("phone"))+'</span><div class="input-row"><span class="prefix">+968</span><input id="cPhone" inputmode="numeric" maxlength="8"></div></label>'+
        '<button class="btn primary" data-action="save-contact">'+esc(t("save"))+'</button>';
      $("#modal").showModal();break;

    case "save-contact":
      var cn=$("#cName").value.trim();
      var cp=normPhone($("#cPhone").value);
      if(!cn||!/^\d{8}$/.test(cp)){toast(t("required"),"err");return;}
      STATE.contacts.push({id:uid(),name:cn,phone:cp,createdAt:Date.now(),favorite:false});
      Store.save();
      logActivity("CONTACT_CREATED",cn);
      $("#modal").close();App.render();break;

    case "do-export":
      var data={version:1,exportedAt:Date.now(),user:STATE.user,transactions:STATE.transactions,contacts:STATE.contacts,activity:STATE.activity,balanceBaisa:STATE.balanceBaisa};
      var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);a.download="nizwa-backup-"+Date.now()+".json";
      document.body.appendChild(a);a.click();a.remove();
      toast("\u2713","ok");break;

    case "change-pw":
      $("#modal").innerHTML='<div class="modal-head"><h2>'+esc(t("changePw"))+'</h2><button class="icon-btn" data-close>'+svg("close")+'</button></div>'+
        '<label class="field"><span>Ancien</span><input id="oldPw" type="password"></label>'+
        '<label class="field"><span>Nouveau</span><input id="newPw" type="password" minlength="6"></label>'+
        '<label class="field"><span>Confirmer</span><input id="newPw2" type="password" minlength="6"></label>'+
        '<p id="pwError" class="error"></p>'+
        '<button class="btn primary" data-action="do-change-pw">'+esc(t("save"))+'</button>';
      $("#modal").showModal();break;

    case "do-change-pw":
      var oldP=$("#oldPw").value,nP=$("#newPw").value,nP2=$("#newPw2").value;
      var okP=await Account.verify(oldP);
      if(!okP){$("#pwError").textContent="Incorrect";return;}
      if(nP.length<6){$("#pwError").textContent=t("pwWeak");return;}
      if(nP!==nP2){$("#pwError").textContent=t("pwMismatch");return;}
      var cred=await Crypto.hash(nP);
      STATE.user.passwordCredential={hash:cred.hash,salt:cred.salt,method:cred.method};
      Store.save();logActivity("PASSWORD_CHANGED","");
      $("#modal").close();toast("\u2713","ok");break;

    case "logout-all":
    case "confirm-logout":
      logActivity("LOGOUT","");
      sessionEnd();
      $("#modal").close();
      App.go("login");break;

    case "logout":
      $("#modal").innerHTML='<div class="modal-head"><h2>'+esc(t("logout"))+'</h2><button class="icon-btn" data-close>'+svg("close")+'</button></div>'+
        '<p>Confirmer ?</p>'+
        '<div class="grid2" style="margin-top:12px"><button class="btn soft" data-close>'+esc(t("cancel"))+'</button>'+
        '<button class="btn danger" data-action="confirm-logout">'+esc(t("yes"))+'</button></div>';
      $("#modal").showModal();break;

    case "reset-data":
      $("#modal").innerHTML='<div class="modal-head"><h2>'+esc(t("resetData"))+'</h2><button class="icon-btn" data-close>'+svg("close")+'</button></div>'+
        '<p>'+esc(t("resetConfirm"))+'</p>'+
        '<div class="grid2" style="margin-top:12px"><button class="btn soft" data-close>'+esc(t("cancel"))+'</button>'+
        '<button class="btn danger" data-action="confirm-reset">'+esc(t("yes"))+'</button></div>';
      $("#modal").showModal();break;

    case "confirm-reset":
      Store.clear();
      sessionEnd();
      $("#modal").close();
      location.reload();break;
  }
}

function handleReceiptAction(act){
  var x=Tx.get(STATE.currentTxId);if(!x)return;
  if(act==="share-receipt"){
    var txt=BRAND+" - Re\u00e7u\nRef: "+x.reference+"\nDate: "+when(x.createdAt)+"\n"+t("from")+": "+x.sender+" "+fmtPhone(STATE.user.phone)+"\n"+t("to")+": "+fmtPhone(x.recipientPhone)+"\n"+t("amount")+": "+money(x.amount)+" OMR";
    if(navigator.share)navigator.share({title:BRAND,text:txt}).catch(function(){});
    else{try{navigator.clipboard.writeText(txt);toast(t("copied"),"ok");}catch(e){toast(t("copied"));}}
  }else if(act==="download-receipt"){
    var txt2=BRAND+" - Re\u00e7u\nRef: "+x.reference+"\n"+money(x.amount)+" OMR";
    var blob=new Blob([txt2],{type:"text/plain"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="recu-"+x.reference+".txt";
    document.body.appendChild(a);a.click();a.remove();toast("\u2713","ok");
  }else if(act==="print-receipt"){
    $("#printArea").innerHTML='<div style="padding:24px;font-family:system-ui">'+
      '<h1>'+BRAND+'</h1><h2>'+t("transferDone")+'</h2>'+
      '<div style="font-size:32px;font-weight:800">OMR '+money2(x.amount)+'</div>'+
      '<p>'+t("referenceId")+': '+x.reference+'</p>'+
      '<p>'+t("dateTime")+': '+when(x.createdAt)+'</p></div>';
    setTimeout(function(){window.print();},80);
  }
}

/* ---------- Events ---------- */
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="createForm")handleCreate();
  else if(e.target.id==="loginForm")handleLogin();
  else if(e.target.id==="loginExistingForm")handleExistingLogin();
});

document.addEventListener("input",function(e){
  var o=e.target.closest("[data-otp]");
  if(o){
    var v=o.value.replace(/\D/g,"").slice(-1);
    o.value=v;
    o.classList.toggle("filled",!!v);
    var idx=Number(o.dataset.otp);
    if(v&&idx<5){var n=$$("[data-otp]")[idx+1];if(n)n.focus();}
    var all=$$("[data-otp]").map(function(i){return i.value;}).join("");
    if(all.length===6)verifyOtp(all);
  }
  if(e.target.id==="searchTx"){
    var q=e.target.value.toLowerCase();
    var list=STATE.transactions.filter(function(x){
      return x.reference.toLowerCase().indexOf(q)>=0||
        fmtPhone(x.recipientPhone).toLowerCase().indexOf(q)>=0||
        String(x.amount).indexOf(q)>=0;
    });
    var c=$("#txListContainer");if(c)c.innerHTML=txList(list);
  }
});

document.addEventListener("change",function(e){
  var s=e.target.closest("[data-set]");
  if(s){
    if(s.dataset.set==="theme"){STATE.theme=s.value;Store.save();App.applyTheme();}
  }
});

document.addEventListener("click",async function(e){
  var closeBtn=e.target.closest("[data-close]");
  if(closeBtn){e.preventDefault();$("#modal").close();return;}

  var txEl=e.target.closest("[data-tx]");
  if(txEl){e.preventDefault();STATE.currentTxId=txEl.dataset.tx;App.go("tx-detail");return;}

  var sendC=e.target.closest("[data-send]");
  if(sendC){e.preventDefault();openSend(sendC.dataset.send);return;}

  var notifEl=e.target.closest("[data-notif]");
  if(notifEl){e.preventDefault();
    var n=STATE.notifications.find(function(x){return x.id===notifEl.dataset.notif;});
    if(n){n.read=true;Store.save();App.render();}return;}

  var tog=e.target.closest("[data-tog]");
  if(tog){e.preventDefault();
    if(tog.dataset.tog==="hidden"){STATE.hidden=!STATE.hidden;Store.save();App.render();}return;}

  var f=e.target.closest("[data-filter]");
  if(f){e.preventDefault();STATE.filter=f.dataset.filter;App.render();return;}

  var key=e.target.closest("[data-key]");
  if(key){e.preventDefault();pushKey(key.dataset.key);return;}

  var pk=e.target.closest("[data-pin]");
  if(pk){e.preventDefault();handlePinKey(pk.dataset.pin);return;}

  var qa=e.target.closest("[data-quick]");
  if(qa){e.preventDefault();STATE.raw=qa.dataset.quick;var el=$("#amountValue");if(el)el.textContent=STATE.raw;return;}

  var qt=e.target.closest("[data-quick-top]");
  if(qt){e.preventDefault();var inp=$("#topupAmount");if(inp)inp.value=qt.dataset.quickTop+".000";return;}

  var pg=e.target.closest("[data-page]");
  if(pg){e.preventDefault();App.go(pg.dataset.page);return;}

  var a=e.target.closest("[data-action]");
  if(a){e.preventDefault();await handleAction(a.dataset.action,a);return;}

  sessionTouch();
});

document.addEventListener("keydown",sessionTouch,{passive:true});
document.addEventListener("touchstart",sessionTouch,{passive:true});

$("#modal").addEventListener("click",function(e){if(e.target===$("#modal"))$("#modal").close();});
$("#unlockBtn").addEventListener("click",async function(){
  var pw=$("#lockPw").value;
  var ok=await Account.verify(pw);
  if(!ok){$("#lockError").textContent=t("invalidLogin");return;}
  $("#lockScreen").classList.remove("on");
  $("#lockPw").value="";$("#lockError").textContent="";
  sessionTouch();
});
$("#lockPw").addEventListener("keydown",function(e){if(e.key==="Enter")$("#unlockBtn").click();});
$("#lockLogout").addEventListener("click",function(){
  $("#lockScreen").classList.remove("on");
  sessionEnd();
  App.go("login");
});

/* Patch render pour OTP timer */
var _origRender=App.render.bind(App);
App.render=function(){
  _origRender();
  if(this.page==="otp"&&!otpTimerInterval)startOtpTimer();
  if(this.page!=="otp"&&otpTimerInterval){clearInterval(otpTimerInterval);otpTimerInterval=null;}
};

/* Splash arabic text */
document.addEventListener("DOMContentLoaded",function(){
  var el=document.getElementById("splashAr");
  if(el)el.textContent=TAGLINE_AR;
});

/* ---------- Boot ---------- */
App.boot();
